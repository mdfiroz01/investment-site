<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Nexora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-4 md:p-6">

  <div id="adminApp" class="max-w-4xl mx-auto space-y-6">
    <header class="flex items-center justify-between border-b border-slate-800 pb-4">
      <h1 class="text-xl font-black text-[#00a86b]">Nexora Master Admin Panel</h1>
      <a href="index.html" class="bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold">মেইন অ্যাপ</a>
    </header>

    <!-- Global Controls -->
    <section class="bg-slate-800/80 p-5 rounded-3xl border border-slate-700 space-y-4">
      <h3 class="font-black text-sm text-amber-400">⚙️ একাউন্ট একটিভেশন ও গ্লোবাল কন্ট্রোল</h3>
      <form onsubmit="saveAdminSettings(event)" class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs font-bold">
        <div>
          <label class="block text-slate-400 mb-1">একাউন্ট একটিভেশন মোড</label>
          <select id="setActMode" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-white">
            <option value="paid">Paid (টাকা ডিপোজিট করে একটিভ)</option>
            <option value="bonus">Bonus (বোনাস টাকা কেটে একটিভ)</option>
            <option value="free">Free (ফ্রি একাউন্ট একটিভ)</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">একটিভেশন ফি (৳)</label>
          <input id="setActFee" type="number" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">দৈনিক বোনাস (৳)</label>
          <input id="setDailyBonus" type="number" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl">
        </div>
        <div class="md:col-span-3">
          <label class="block text-slate-400 mb-1">নোটিশ টেক্সট</label>
          <input id="setNotice" type="text" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl">
        </div>
        <button type="submit" class="md:col-span-3 bg-[#00a86b] py-3 rounded-xl font-black text-white">সেটিংস আপডেট করুন</button>
      </form>
    </section>

    <!-- Pending Requests List -->
    <section class="bg-slate-800/80 p-5 rounded-3xl border border-slate-700 space-y-4">
      <h3 class="font-black text-sm text-emerald-400">📥 পেন্ডিং ডিপোজিট ও একটিভেশন রিকোয়েস্ট</h3>
      <div id="pendingRequestsList" class="space-y-3"></div>
    </section>
  </div>

  <script src="admin.js"></script>
</body>
</html>
