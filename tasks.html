
<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EarnerApp - Daily Tasks</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/nLWFr8bT/file-00000000bd4482119c9000fc41b37ec4.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <header class="top-header">
    <div class="header-left"><i class="fa-solid fa-bars menu-icon" onclick="openSidebar()"></i><div style="display:flex; align-items:center; gap:8px;"><img src="https://i.postimg.cc/kXTyBwGr/file-00000000a5dc82119e23c1aae6e24a70.png" class="header-logo-img" alt="Logo"><h3 class="app-logo">EarnerApp</h3></div></div>
    <div style="display:flex; align-items:center; gap:12px;"><div class="theme-toggle-btn" onclick="toggleAppTheme()"><i id="theme-icon" class="fa-solid fa-moon"></i></div><div class="notif-wrapper" onclick="openNotifModal()"><i class="fa-solid fa-bell notif-icon"></i><span class="notif-badge-dot"></span></div></div>
  </header>

  <div class="notice-board"><div class="notice-icon-box"><i class="fa-solid fa-bullhorn"></i></div><div class="notice-marquee-wrapper"><div class="notice-text" id="notice-text">স্বাগতম! আমাদের প্ল্যাটফর্মে প্রতিদিনের সহজ টাস্ক পূরণ করে আয় শুরু করুন।</div></div></div>

  <div class="app-viewport">
    <div class="page-title-card">
      <div class="page-title-icon-box"><i class="fa-solid fa-list-check"></i></div>
      <div><h2>দৈনিক টাস্কসমূহ</h2><p id="task-limit-status-summary">আপনার বর্তমান VIP ও ফ্রি টাস্ক সম্পন্ন করুন</p></div>
    </div>

    <!-- 3 STATS COUNTER GRID -->
    <div class="task-stats-grid">
      <div class="task-stat-box"><div class="task-stat-icon total"><i class="fa-solid fa-list-check"></i></div><div class="task-stat-num" id="stat-task-total">0</div><div class="task-stat-label">মোট টাস্ক</div></div>
      <div class="task-stat-box"><div class="task-stat-icon completed"><i class="fa-solid fa-circle-check"></i></div><div class="task-stat-num" id="stat-task-completed">0</div><div class="task-stat-label">সম্পন্ন</div></div>
      <div class="task-stat-box"><div class="task-stat-icon available"><i class="fa-solid fa-clock"></i></div><div class="task-stat-num" id="stat-task-available">0</div><div class="task-stat-label">উপলব্ধ</div></div>
    </div>

    <div id="task-plan-bonus-banner" style="margin: 0 12px 12px 12px;"></div>
    <div id="tasks-list-container" class="plans-wrapper"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>হোম</span></a>
    <a href="wallet.html" class="nav-item"><i class="fa-solid fa-wallet"></i><span>ওয়ালেট</span></a>
    <a href="plans.html" class="nav-item plan-center-btn"><div class="center-circle"><i class="fa-solid fa-layer-group"></i></div><span>প্ল্যান</span></a>
    <a href="withdraw.html" class="nav-item"><i class="fa-solid fa-arrow-right-arrow-left"></i><span>উত্তোলন</span></a>
    <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>একাউন্ট</span></a>
  </nav>

  <div id="common-ui-wrapper"></div>
  <script src="firebase.js"></script>
  <script src="script.js"></script>
</body>
</html>
