
<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EarnerApp - Spin & Win</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/nLWFr8bT/file-00000000bd4482119e23c1aae6e24a70.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <header class="top-header">
    <div class="header-left"><i class="fa-solid fa-bars menu-icon" onclick="openSidebar()"></i><div style="display:flex; align-items:center; gap:8px;"><img src="https://i.postimg.cc/kXTyBwGr/file-00000000a5dc82119e23c1aae6e24a70.png" class="header-logo-img" alt="Logo"><h3 class="app-logo">EarnerApp</h3></div></div>
    <div style="display:flex; align-items:center; gap:12px;"><div class="theme-toggle-btn" onclick="toggleAppTheme()"><i id="theme-icon" class="fa-solid fa-moon"></i></div><div class="notif-wrapper" onclick="openNotifModal()"><i class="fa-solid fa-bell notif-icon"></i><span class="notif-badge-dot"></span></div></div>
  </header>

  <div class="notice-board"><div class="notice-icon-box"><i class="fa-solid fa-bullhorn"></i></div><div class="notice-marquee-wrapper"><div class="notice-text" id="notice-text">স্বাগতম! আমাদের প্ল্যাটফর্মে প্রতিদিনের সহজ টাস্ক পূরণ করে আয় শুরু করুন।</div></div></div>

  <div class="app-viewport">
    <div class="page-title-card" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);">
      <div class="page-title-icon-box" style="background: rgba(255,255,255,0.22);"><i class="fa-solid fa-arrows-spin"></i></div>
      <div><h2>স্পিন অ্যান্ড উইন 🎡</h2><p id="spin-count-summary">আজকের অবশিষ্ট স্পিন: 3 টি</p></div>
    </div>

    <!-- SPIN WHEEL CONTAINER -->
    <div class="content-card" style="text-align: center; padding: 25px 15px;">
      <div class="wheel-outer-wrap">
        <div class="wheel-pointer">▼</div>
        <canvas id="wheel-canvas" width="300" height="300"></canvas>
      </div>

      <button id="btn-spin-now" class="btn-action" style="margin-top:20px; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); font-size:16px;" onclick="spinWheelNow()">
        🎰 স্পিন করুন 🚀
      </button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>হোম</span></a>
    <a href="wallet.html" class="nav-item"><i class="fa-solid fa-wallet"></i><span>ওয়ালেট</span></a>
    <a href="plans.html" class="nav-item plan-center-btn"><div class="center-circle"><i class="fa-solid fa-layer-group"></i></div><span>প্ল্যান</span></a>
    <a href="withdraw.html" class="nav-item"><i class="fa-solid fa-arrow-right-arrow-left"></i><span>উত্তোলন</span></a>
    <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>একাউন্ট</span></a>
  </nav>

  <div id="common-ui-wrapper"></div>
  <script src="firebase.js"></script>
  <script src="script.js"></script>
</body>
</html>
